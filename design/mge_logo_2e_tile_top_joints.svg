<svg xmlns="http://www.w3.org/2000/svg" width="400" height="140" viewBox="0 0 400 140">
  <!-- Variant 2e "Tile, top joints": app-icon tile matching the Filomena house icon + horizontal wordmark -->
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#blue)"/>
  <rect x="10" y="10" width="120" height="120" rx="28" fill="url(#gloss)"/>
  <!-- M drawn as a small node graph ("engine") -->
  <polyline points="38,96 38,44 70,76 102,44 102,96" fill="none" stroke="#FFFFFF"
            stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#BFD6FF" stroke="#FFFFFF" stroke-width="4">
    <circle cx="38" cy="44" r="8"/><circle cx="102" cy="44" r="8"/><circle cx="70" cy="76" r="8"/>
  </g>
  <text x="152" y="86" font-family="Segoe UI, Arial" font-weight="800" font-size="66"
        letter-spacing="3" fill="#1B2A4A">MGE</text>
  <text x="155" y="114" font-family="Segoe UI, Arial" font-weight="600" font-size="15.5"
        letter-spacing="2.4" fill="#5B6B8C">MICRO GAME ENGINE</text>
</svg>
