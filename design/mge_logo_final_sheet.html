<!doctype html><html><head><meta charset="utf-8"><style>
html{background:#EEF3FC}body{margin:0;width:1400px;background:linear-gradient(135deg,#EEF3FC,#F7F9FE);font-family:"Segoe UI",Arial;color:#1B2A4A;padding-bottom:8px}
h1{font-size:28px;margin:28px 40px 24px}
.card{margin:0 40px 24px;padding:40px;background:#fff8;border:1px solid #DCE5F5;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:56px}
.hero img{width:760px}
.cap{font-size:14px;color:#5B6B8C;text-align:center;margin-top:12px}
.sizes{align-items:flex-end}
.sizes div{text-align:center}
.split{display:flex;gap:24px;margin:0 40px}.split .card{margin:0;flex:1}
</style></head><body>
<h1>MGE – Micro Game Engine · logo</h1>
<div class="card hero"><img src="mge_logo_2e_tile_top_joints.svg"></div>
<div class="split">
 <div class="card sizes">
  <div><img src="mge_icon_final.svg" width="128"><div class="cap">128 px</div></div>
  <div><img src="mge_icon_final.svg" width="64"><div class="cap">64 px</div></div>
  <div><img src="mge_icon_final.svg" width="32"><div class="cap">32 px</div></div>
  <div><img src="mge_icon_final.svg" width="16"><div class="cap">16 px</div></div>
 </div>
 <div class="card sizes">
  <div><img src="mge_logo_2e_tile_top_joints.svg" width="300"><div class="cap">300 px</div></div>
  <div><img src="mge_logo_2e_tile_top_joints.svg" width="160"><div class="cap">160 px</div></div>
 </div>
</div>
</body></html>
